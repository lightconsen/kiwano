[package]
name = "kiwano-app"
license.workspace = true
version.workspace = true
description = "Kiwano — local-first AI model Provider manager"
authors = ["john2ai <john@lightconsen.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiwano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The application layer (providers, routes, takeover, sync, sidecar control)
# lives in kiwano-core, shared with the CLI. What is left here is the Tauri
# shell: commands, tray, updater, and the managed state that ties them together.
kiwano-core = { path = "../../crates/core" }
kiwanod = { path = "../../crates/gateway" }
tracing = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

# Release profile lives at the workspace root (Cargo ignores per-package profiles).
