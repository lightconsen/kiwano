# Deploy the static marketing site (site/) to GitHub Pages.
# Pure static files — no build step. Runs only when site/ (or this file) changes
# on main; PRs never deploy. Site URL: https://lightconsen.github.io/kiwano/
#
# One-time repo setting (required before the first run succeeds):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy mid-flight; queue instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
