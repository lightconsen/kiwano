[package]
name = "kiwano-core"
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Kiwano's application layer: provider/routing logic and view models, shared by the desktop app and the CLI"

[lib]
name = "kiwano_core"
path = "src/lib.rs"

[dependencies]
kiwanod = { path = "../gateway" }
kiwano-adapters = { path = "../adapters" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13" }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

# Agent detection (detect.rs) reaches outside the process on both platforms:
# a session of its own so a wedged probe can be killed as a group, and — on
# Windows — the registry's PATH plus the console's code page.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dirs = "5.0"
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
