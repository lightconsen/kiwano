[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/core", "crates/gateway", "crates/adapters", "crates/cli", "crates/api"]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["john2ai <john@lightconsen.com>"]
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
