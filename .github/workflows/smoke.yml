# Release smoke: install the packaged artifact and prove it comes up.
#
# The release pipeline builds, signs and publishes the four bundles — and then
# stops. Nothing ever starts one, so "the artifact installed" was an untested
# claim: the cmd window on Windows (fixed in 0.2.1) and the mac bundle missing
# its sidecar (caught by CI comments, not by a machine) are the two failures a
# run of *this* job would have caught instead of a user.
#
# It runs when a release is published, and by hand (`workflow_dispatch`,
# defaulting to the latest release). Each platform downloads its own artifact,
# installs or stages it, launches the app, and then listens: the gateway's
# data plane at 127.0.0.1:8317 answers on a port (any HTTP code other than a
# refused connection proves the daemon bound both planes), the admin plane
# answers `GET /status` with the released version (Linux, where it is a unix
# socket the step can reach), and the daemon's own log says `ready`. The
# screenshots are evidence for a human, not a gate: a `:root` capture of the
# window (Linux only — Windows runners have no sane capture tool) is uploaded
# as an artifact but never fails the job.

name: Release smoke

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # `gh` is preinstalled on the runners; a checkout is only for its config.
      - uses: actions/checkout@v7

      - name: Resolve the release under test
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || '' }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the platform artifact
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            pattern='Kiwano_*_x64-setup.exe'
          else
            pattern='Kiwano_*_amd64.AppImage'
          fi
          if ! gh release download "${{ steps.rel.outputs.tag }}" \
              --pattern "$pattern" --dir artifacts --clobber; then
            echo "::error::no artifact matched '$pattern' on ${{ steps.rel.outputs.tag }}"
            gh release view "${{ steps.rel.outputs.tag }}" --json assets \
              -q '.assets[].name' || true
            exit 1
          fi
          echo "downloaded: $(ls artifacts)"

      # ── Windows: silent-install, locate, launch ──────────────────────────
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -Filter '*.exe' | Select-Object -First 1 -ExpandProperty FullPath
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $roots = @(Join-Path $env:LOCALAPPDATA 'Kiwano'),
                    (Join-Path $env:LOCALAPPDATA 'Programs\Kiwano'),
                    (Join-Path ${env:PROGRAMFILES} 'Kiwano')
          $exe = Get-ChildItem -Path $roots -Recurse -Filter 'Kiwano.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullPath
          if (-not $exe) {
            Write-Error "installed Kiwano.exe not found under: $($roots -join ', ')"
          }
          echo "APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Launch the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath $env:APP_EXE

      # ── Linux: AppImage is self-contained (a .deb would drag webkit deps) ─
      - name: Stage the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          img=$(ls artifacts/*.AppImage)
          chmod +x "$img"
          # Runners have no FUSE, so run the extracted payload directly: the
          # runtime's `--appimage-extract` drops `squashfs-root/` without
          # mounting anything, and its `AppRun` then runs the real payload.
          "$img" --appimage-extract
          echo "APP=$(pwd)/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # The system GL libraries webkit needs at load time; the AppImage does
      # not bundle them (they are host concern), and the runner has none of
      # them — without these, the app dies before a single log line with
      # `libEGL.so.1: cannot open shared object file`.
      - name: Install webkit's runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The AppImage bundles webkit2gtk itself but not the host system
          # libraries it dlopen's: GL for compositing, and the webkit runtime
          # set (nss, atk, x-extensions, gbm). Miss any one and the app dies
          # with a bare abort before its first log line. The ldd below is the
          # receipt: it names anything still missing.
          sudo apt-get update && sudo apt-get install -y \
            libegl1 libgl1 \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libxkbcommon0 libasound2


      - name: Name anything still missing (Linux)
        if: runner.os == 'Linux'
        run: |
          bin=$(find squashfs-root -type f -name 'kiwano-app' -o -type f -name 'kiwano' | head -1)
          echo "checking: $bin"
          ldd "$bin" 2>/dev/null | grep "not found" || echo "nothing missing from ldd's view"

      - name: Launch under a display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x800x24 &

          export DISPLAY=:99
          # Xvfb has no GPU compositing; webkit will not initialize without
          # this in a headless display — the standard CI requirement.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          "$APP" > app.stderr 2>&1 &
          echo $! > app.pid
          # Let the webview come up before anyone screenshots it.
          sleep 25

      # The shared sign of life: the gateway's data plane is listening. A
      # request with no placeholder key is answered 401 (`gateway::router`),
      # and a refused connection would surface as 000 — so anything in
      # {400..499} means the daemon bound :8317 and is reading the DB.
      - name: Prove the gateway is listening
        shell: bash
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -X POST http://127.0.0.1:8317/v1/chat/completions \
              -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 2
          done
          echo "data plane answered $code"
          case "$code" in
            4[0-9][0-9]|2[0-9][0-9]) echo "gateway is up" ;;
            *) echo "::error::data plane never answered; code=$code" ; exit 1 ;;
          esac

      # The admin plane is the deeper claim: it needs the token out of the
      # shared SQLite and answers only to it — so a parsed, version-matched
      # `/status` proves not just "a port is open" but "our daemon, our DB".
      # Windows' admin plane is a named pipe with a per-user GUID name, which
      # a step cannot reach, so only Linux does this; Windows relies on the
      # data-plane probe plus the log line below.

      - name: Show what the app printed (on failure)
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          echo "--- app.stderr ---"
          tail -40 app.stderr 2>/dev/null || true
          echo "--- daemon log tail ---"
          tail -20 "$HOME/.kiwano/logs/"kiwano.log.* 2>/dev/null || true

      - name: Ask the admin plane for its version (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python3 - "${{ steps.rel.outputs.tag }}" "$HOME" <<'PY'
          import json, os, socket, sqlite3, sys
          tag, home = sys.argv[1], sys.argv[2]
          db = os.path.join(home, ".kiwano", "kiwano.db")
          token = sqlite3.connect(db).execute(
              "SELECT value FROM app_settings WHERE key = 'gateway.admin_token'"
          ).fetchone()[0]
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.connect(os.path.join(home, ".kiwano", "admin.sock"))
          sock.sendall(
              f"GET /status HTTP/1.1\r\nHost: localhost\r\n"
              f"x-kiwano-admin-token: {token}\r\n\r\n".encode()
          )
          data = b""
          while True:
              chunk = sock.recv(65536)
              if not chunk:
                  break
              data += chunk
          body = json.loads(data.split(b"\r\n\r\n", 1)[1])
          print("admin plane:", {k: body[k] for k in ("name", "version")})
          assert body["name"] == "kiwanod", body
          assert body["version"] == tag.lstrip("v"), (body["version"], tag)
          PY

      # The daemon also writes its own log; a `ready` line is independent
      # evidence (the data-plane probe could in theory hit a stale listener
      # from a previous smoke on a shared runner — it cannot).
      - name: The daemon's log says ready
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ready=0
          for i in $(seq 1 60); do
            if grep -rq "kiwanod ready" "$HOME/.kiwano/logs/" 2>/dev/null; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::no 'kiwanod ready' in ~/.kiwano/logs"
            ls -la "$HOME/.kiwano/logs/" 2>/dev/null || true
            exit 1
          fi
          echo "daemon log shows ready"

      # Evidence for a human, never a gate: a window that renders is nice to
      # look at, but a headless runner's capture is exactly as reliable as the
      # probes above and less definitive. Failing hard on a screenshot nuance
      # would burn a release.
      - name: Capture the window (Linux, best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          command -v import >/dev/null 2>&1 || sudo apt-get install -y imagemagick >/dev/null 2>&1
          sleep 8
          import -display :99 -window root window.png
          echo "captured window.png ($(du -h window.png | cut -f1))"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: smoke-window-${{ matrix.os }}
          path: window.png
          if-no-files-found: ignore

      # Clean up so a shared runner does not leak a daemon between smokes.
      - name: Stop the app
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //IM Kiwano.exe 2>/dev/null || true
            taskkill //F //IM kiwanod.exe 2>/dev/null || true
          else
            kill "$(cat app.pid)" 2>/dev/null || true
            pkill -f 'squashfs-root/AppRun' 2>/dev/null || true
            pkill -f 'kiwanod' 2>/dev/null || true
          fi