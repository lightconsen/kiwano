[package]
name = "kiwano-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wire types Kiwano's clients and its daemon agree on"

[lib]
# `kiwano-api` / `kiwano_api`: the same split `kiwano-adapters` uses.
name = "kiwano_api"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
