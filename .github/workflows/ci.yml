# PR validation: rustfmt, clippy (-D warnings), tests, frontend typecheck+build.
# Rust runs on Linux, macOS and Windows — macOS-gated code (detect.rs /
# takeover.rs) only compiles on macOS, and the Windows DACL hardening in
# store/mod.rs (`harden_permissions`) only compiles on Windows, so a matrix
# without Windows leaves that path type-unchecked and its test unrun. The repo
# is public, so extra runner minutes are free.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job on purpose: as the first step of `rust` below, a formatting
  # nit aborted the whole job, so clippy and the test suite never ran at all.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 on ubuntu 24.04: webkit2gtk 4.1 + ayatana appindicator (tray-icon)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Windows needs no package install for Tauri v2: WebView2 ships with the
      # windows-latest image, and the MSVC linker comes from the image's VS
      # install, which rustup's msvc toolchain picks up.

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Before the first cargo command, not after: `tauri_build::build()` in
      # app/src-tauri/build.rs resolves `externalBin` at build-script time, so a
      # missing sidecar fails clippy and the tests themselves with
      # "resource path `binaries/kiwano-gateway-<triple>` doesn't exist" —
      # not just the bundle step. Debug profile on purpose: this is about the
      # path and the naming, and does not need the LTO release build.
      # `shell: bash` explicitly: on windows-latest the default is PowerShell,
      # which cannot run `set -euo pipefail` or the `|| { …; exit 1; }` guards.
      # Git Bash is on the image and stages the .exe under the same script.
      - name: Sidecar staging
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"externalBin"' app/src-tauri/tauri.conf.json \
            || { echo "::error::bundle.externalBin is gone from tauri.conf.json"; exit 1; }
          node scripts/build-sidecar.mjs
          triple=$(rustc -vV | sed -n 's/^host: //p')
          exe=""
          case "$triple" in *windows*) exe=".exe" ;; esac
          test -x "app/src-tauri/binaries/kiwano-gateway-$triple$exe" \
            || { echo "::error::build-sidecar.mjs did not stage kiwano-gateway-$triple$exe"; exit 1; }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # The lockfile lives with the frontend, not at the repo root.
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # `tsc && vite build` — typecheck plus a real bundle
      - name: Typecheck and build
        working-directory: app
        run: pnpm build
