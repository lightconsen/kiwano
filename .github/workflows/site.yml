# Deploy the static marketing site (site/) to GitHub Pages.
# No build step at serve time — pages are served as written. Three things run
# before the upload: `scripts/sync-site.mjs` copies the version and the licence
# name out of `app/package.json` into the page's sources (site/src/),
# `scripts/build-site.mjs` rebuilds site/index.html from those sources (the
# committed file is a build output, same convention as site/demo/), and
# `scripts/build-docs.mjs` renders docs/*.md into site/docs/ plus the sitemap.
#
# The site build needs exactly one dependency (esbuild, at the repo root) —
# deliberately not the app's toolchain.
#
# site/demo/ is git-tracked for the same reason and is *not* built here: it is
# the app compiled for the browser (node scripts/build-demo.mjs), which would
# mean a full pnpm install and the app's toolchain in this workflow. Rebuild it
# locally whenever anything under app/src/ changes — otherwise the embedded
# demo drifts from the app it claims to be.
#
# `app/package.json` is in the trigger list for that reason: a release bumps it,
# and without this the site would keep its old version until something else
# under `site/` happened to change. PRs never deploy. Site URL:
# https://lightconsen.github.io/kiwano/
#
# One-time repo setting (required before the first run succeeds):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.md"
      - "scripts/sync-site.mjs"
      - "scripts/build-site.mjs"
      - "scripts/build-docs.mjs"
      - "scripts/vendor/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app/package.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy mid-flight; queue instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The landing page is built in CI now: site/index.html is a committed
      # build output (same convention as site/demo/), generated from site/src/
      # by scripts/build-site.mjs. esbuild is the only dep and lives at the
      # repo root, so the install is one package, not the app's toolchain.
      - name: Install esbuild (site build tooling)
        run: |
          npm install -g pnpm@10.24.0
          pnpm install --frozen-lockfile

      # The page carries the release version and the licence name, both copied
      # from `package.json` — and both had gone stale, the licence by two
      # releases. Stamp them into the SOURCES (site/src/) from the source of
      # truth, then rebuild the page, so the deployed site is current whatever
      # the committed files happen to say.
      - name: Stamp version and licence from app/package.json
        run: node scripts/sync-site.mjs

      - name: Build the landing page from site/src
        run: node scripts/build-site.mjs

      # docs/*.md render into site/docs/ as plain HTML (git-tracked, so the
      # served site stays what was committed); the sitemap is regenerated
      # with them, lastmod read from each page's git history.
      - name: Render docs pages and sitemap
        run: node scripts/build-docs.mjs

      # 源目录留在上传里,整棵树就成了公开网页:kiwano.cc/src/index.html 曾经
      # 可访问,而且它是**模板原件**——CSS/JS 的占位符没被替换,所以那是一个没
      # 样式、没脚本的页面,和首页重复着一份同样的文案。/src/main.ts、/src/
      # styles.css 同样可下载。它不是敏感信息(仓库本来就公开),但一个坏页面
      # 与一份重复内容是两件不该发生的事。
      #
      # 所以上传前摘掉它。上面三步已经把它编译成产物了,这一步在它们之后、上传
      # 之前,留下的 site/ 仍然自洽(本地那份带 src,只有部署时剥掉)。
      - name: Drop the sources from the upload
        run: rm -rf site/src

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
