# Tag-triggered release build (docs/upgrade.md phase 3, lightweight variant).
# Pushing a `v*` tag builds all three platforms and opens a DRAFT release;
# inspect and publish it manually. Updater artifacts (latest.json + .sig)
# land here once tauri-plugin-updater is wired up (phase 0+1). Builds are
# unsigned for now: macOS Gatekeeper needs right-click → Open, Windows
# SmartScreen shows a warning.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run from a tag ref, not a branch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin # Apple Silicon (M series)
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin # Intel
            rust_targets: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same Tauri v2 system packages as ci.yml (webkit2gtk 4.1 + ayatana appindicator)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kiwano ${{ github.ref_name }}"
          releaseBody: >-
            安装包未做代码签名：macOS 首次打开需右键 → 打开，
            Windows SmartScreen 出现提示时选择“仍要运行”。

            macOS 请按芯片选择：aarch64 = Apple Silicon（M 系列），
            x86_64 = Intel。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Mirror the built installers to Cloudflare R2 under releases/ (served
      # at hub.kiwano.cc/releases). GitHub Releases stays the updater's
      # authoritative manifest source; R2 is the download mirror for the site.
      - name: Mirror artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        # Single line on purpose: the Windows runner's shell is PowerShell,
        # where a backslash does not continue a line. --exclude drops the raw
        # .app bundle tree (dmg + updater tar.gz are what matter).
        # The build passes --target, so bundles land under target/<triple>/.
        run: aws s3 sync target/${{ matrix.target }}/release/bundle s3://kiwano-hub/releases --no-progress --exclude "*.app" --exclude "*.app/*"
