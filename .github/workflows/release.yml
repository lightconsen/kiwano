# Tag-triggered release pipeline (docs/upgrade.md phase 3).
#
# Pushing a `v*` tag runs the same checks as CI (`verify`), then builds every
# target: macOS aarch64 + x86_64, Windows x64 and Linux x86_64 for the desktop
# app, plus Linux arm64 for the server bundle alone (no app is published for
# arm64 — see the note on that leg). It signs the updater artifacts, uploads
# them to a draft release, and publishes it automatically once every platform
# has landed — the tag push is the only manual step. Because publishing
# needs no human, `verify` is what stops a tag on a red commit from shipping.
# macOS builds are signed with a Developer ID and notarized (app and disk
# image alike); Windows builds are not signed yet, so SmartScreen still warns
# there.
#
# An environment that *cannot* sign — no Apple certificate, no updater key — is
# detected up front by `verify` and produces a degraded build instead of no
# build: ad-hoc-signed macOS bundles, no updater artifacts, no mirror, and a
# warning banner on the release body. Secrets that are present but malformed
# still fail the build. See the probe step in `verify` for the line between the
# two, and `ALLOW_UNSIGNED_BUILD` for shipping unsigned on purpose.
#
# The GitHub release body is the tag's own CHANGELOG.md section (`changelog`
# job), so the notes a reader sees are the ones written before the tag. The
# per-platform install notes are appended, because those describe the artifacts
# rather than the release; a translation of that section, when there is one,
# comes from `docs/release-notes/<version>.<locale>.md` under a
# `<!-- notes:<locale> -->` marker that the app splits on.
#
# A tag with a prerelease suffix (`v0.2.0-rc.1`) is a rehearsal: it runs every
# check and build, then stops. It publishes nothing, mirrors nothing, and
# repoints no manifest — so the signing pipeline can be exercised end to end
# without touching what users are running. See the gates on the mirror and
# publish jobs.
#
# Two outputs: the GitHub release (where the manifest is authored, and the page
# a user lands on) and a Cloudflare R2 mirror under releases/, whose paths carry
# no version so they stay valid across releases. R2 is the updater's *first*
# endpoint, so the release is published before the mirror is repointed at it —
# see the `mirror-*` and `publish` jobs.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run from a tag ref, not a branch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: publishing is automatic now, so a tag pushed onto a red commit would
  # otherwise ship itself. Mirrors the checks in ci.yml (kept deliberately the
  # same commands — update both together). Linux-only is enough: a macOS- or
  # Windows-only compile error still fails its build leg, and `publish` needs
  # every leg, so nothing ships.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `version` is what every "does the artifact agree with the tag" check
    # compares against, resolved once here rather than derived again in each
    # place that needs it. The signing capabilities decide how the build below
    # is allowed to degrade — see the probe step.
    outputs:
      version: ${{ steps.version.outputs.version }}
      apple: ${{ steps.signing.outputs.apple }}
      updater: ${{ steps.signing.outputs.updater }}
      degraded: ${{ steps.signing.outputs.degraded }}
    steps:
      - uses: actions/checkout@v7

      # No `version:` here: pnpm/action-setup reads `packageManager` from
      # package.json, and pinning both is an error in v6 — which is how this
      # workflow came to fail every run since the pin landed.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # The lockfile lives with the frontend, not at the repo root.
          cache-dependency-path: app/pnpm-lock.yaml

      # Before anything that costs minutes, and before the build legs: this is
      # the one check whose failure means "do not ship this tag at all".
      #
      # The updater's trust root is the public key compiled into the app
      # (app/src-tauri/tauri.conf.json → plugins.updater.pubkey). An update is
      # accepted when its minisign signature verifies against that key and
      # nothing else — the app has no second opinion about who may update it. So
      # whoever can change the key at a tagged commit can push code to every
      # installed copy, and the change is one base64 string in a file nobody
      # reads.
      #
      # Comparing the key against itself proves nothing: it lives in the tag's
      # own tree. It is compared against the `EXPECTED_UPDATER_PUBKEY` repository
      # variable instead, which lives outside the repository — a commit, a pull
      # request or a compromised contributor account cannot reach it, only a
      # repository admin can. Set it once (Settings → Secrets and variables →
      # Actions → Variables) to the key on `main`; the failure message prints
      # the value found, so filling it in is a copy-paste.
      #
      # Failing when the variable is unset is deliberate. A check that skips
      # itself when unconfigured is the exact state an attacker would arrange,
      # and it would look like a passing build. To ship without this on purpose,
      # delete the step — do not make it conditional. Same trade as the signing
      # credential check below.
      - name: The updater public key is the one we pinned
        env:
          EXPECTED: ${{ vars.EXPECTED_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          found=$(node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8"));
            const updater = conf.plugins && conf.plugins.updater;
            process.stdout.write((updater && updater.pubkey) || "");
          ')
          [ -n "$found" ] \
            || { echo "::error::app/src-tauri/tauri.conf.json has no plugins.updater.pubkey — the app cannot verify updates at all"; exit 1; }

          if [ -z "${EXPECTED:-}" ]; then
            echo "::error::the EXPECTED_UPDATER_PUBKEY repository variable is unset, so nothing checks the updater's trust root. Set it to: $found"
            exit 1
          fi
          if [ "$EXPECTED" != "$found" ]; then
            echo "::error::the updater public key differs from the pinned value. Every installed copy would accept updates signed by this tag's key — or start refusing ours."
            echo "::error::pinned: $EXPECTED"
            echo "::error::found:  $found"
            exit 1
          fi
          echo "updater public key matches the pinned value"

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        # Bounded and retrying. An apt mirror that stalls used to hang here
        # until the job's budget was gone — the v0.2.8 release spent all 45
        # minutes in this step and was killed without building anything.
        # Failing in ten minutes beats hanging for forty-five: a red run can
        # be re-run, and it says which mirror was slow.
        run: |
          APT="timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Typecheck and build frontend
        working-directory: app
        run: pnpm build

      - name: Frontend tests
        working-directory: app
        run: pnpm test

      # Before the first cargo command, not after: `tauri_build::build()` in
      # app/src-tauri/build.rs resolves `externalBin` at build-script time, so a
      # missing sidecar fails clippy and the tests with "resource path
      # `binaries/kiwanod-<triple>` doesn't exist" — it is a
      # prerequisite for the Rust build, not just for bundling. Debug profile
      # on purpose: this proves the path and the triple-suffix naming agree,
      # and does not need the LTO release build to say so.
      - name: Sidecar staging
        run: |
          set -euo pipefail
          grep -q '"externalBin"' app/src-tauri/tauri.conf.json \
            || { echo "::error::bundle.externalBin is gone from tauri.conf.json"; exit 1; }
          node scripts/build-sidecar.mjs
          triple=$(rustc -vV | sed -n 's/^host: //p')
          test -x "app/src-tauri/binaries/kiwanod-$triple" \
            || { echo "::error::build-sidecar.mjs did not stage kiwanod-$triple"; exit 1; }
          echo "staged app/src-tauri/binaries/kiwanod-$triple"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # What this tag means as a *version*, resolved once for the five places
      # that compare a built artifact against it: the CLI's `--version`, the
      # macOS bundle's CFBundleShortVersionString, the Linux package's Version,
      # and the installed Windows app's ProductVersion.
      #
      # The tag's prerelease suffix is dropped rather than compared. A
      # rehearsal tag names the release it rehearses and carries a suffix
      # (`v0.1.9-rc.1` against a tree whose version is `0.1.9`), so comparing
      # the raw tag fails every rehearsal — and fails it *before* the bundle
      # checks, which are exactly what a rehearsal exists to run.
      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          [ -n "$version" ] \
            || { echo "::error::$GITHUB_REF_NAME carries no version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "this tag is release version $version"

      # What this run can sign with, decided here — once, before every build
      # depends on it — instead of by whichever build leg hits a missing secret
      # first. Two independent capabilities: an Apple Developer ID for the
      # macOS bundles (and the notarization that goes with it), and the updater
      # key that signs what installed copies download.
      #
      # Each is either *absent* or *wrong*, and those are different things:
      #
      #   - Absent (the secret is unset) means this environment cannot sign —
      #     a fork, or a first tag pushed before the secrets were configured.
      #     The answer is a degraded build rather than no build: ad-hoc-signed
      #     macOS bundles, no updater artifacts, no mirror, and a banner on the
      #     release saying so. Loud, but not fatal.
      #   - Present but malformed is a mistake in *this* repository, and the
      #     steps further down still fail hard on it with a message naming the
      #     shape the secret should have. A half-configured certificate set is
      #     in this class too: signing with some of the material and not the
      #     rest is not a capability, it is a typo.
      #
      # `ALLOW_UNSIGNED_BUILD` — a repository *variable*, so only an admin can
      # set it — forces the degraded path even when the secrets are present.
      # That is the deliberate way to ship unsigned (a hotfix while the Apple
      # membership is mid-conversion); the alternative, deleting the secrets,
      # costs a re-paste of the private key to undo. See the banner in the
      # release body, which is what keeps a degraded release from going out
      # unannounced.
      - name: Probe the signing material
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          FORCE_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_BUILD }}
        run: |
          set -euo pipefail

          apple_present=0
          apple_missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -n "${!v:-}" ]; then
              apple_present=$(( apple_present + 1 ))
            else
              apple_missing="$apple_missing $v"
            fi
          done

          forced=0
          if [ "${FORCE_UNSIGNED:-}" = "true" ]; then
            forced=1
            apple=0
            updater=0
            echo "::warning::ALLOW_UNSIGNED_BUILD is set: building unsigned on purpose, with $apple_present/6 Apple secrets and $([ -n "${UPDATER_KEY:-}" ] && echo 'an updater key' || echo 'no updater key') present but deliberately unused"
          else
            case "$apple_present" in
              6) apple=1 ;;
              0) apple=0 ;;
              *)
                echo "::error::some Apple signing secrets are set and some are not (missing:$apple_missing) — a half-configured certificate is a mistake, not an unsigned environment. Set all six, or unset all six."
                exit 1
                ;;
            esac
            if [ -n "${UPDATER_KEY:-}" ]; then updater=1; else updater=0; fi
          fi

          degraded=0
          if [ "$apple" = 0 ]; then
            degraded=1
            [ "$forced" = 1 ] \
              || echo "::warning::no Apple signing material (missing:$apple_missing): macOS bundles will be ad-hoc signed and not notarized"
          fi
          if [ "$updater" = 0 ]; then
            degraded=1
            [ "$forced" = 1 ] \
              || echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset: this build produces no updater artifacts, and the release is neither mirrored nor offered as an update"
          fi

          if [ "$degraded" = 1 ]; then
            {
              echo "## This release is degraded"
              echo
              echo "The tag was pushed in an environment that cannot sign, so this"
              echo "build ships without one or both of its signatures. Installed"
              echo "copies are **not** affected: with no updater artifacts there is"
              echo "no \`latest.json\`, so the R2 mirror is left as it is and no"
              echo "installed app is offered this version."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Apple Developer ID | $([ "$apple" = 1 ] && echo 'signed and notarized' || echo '**ad-hoc signed only** — Gatekeeper refuses it on any other machine') |"
              echo "| Updater artifacts | $([ "$updater" = 1 ] && echo 'signed' || echo '**none produced**, and the mirror is untouched') |"
              echo
              echo "To ship signed instead, set the repository secrets"
              echo "\`APPLE_CERTIFICATE\`, \`APPLE_CERTIFICATE_PASSWORD\`,"
              echo "\`APPLE_SIGNING_IDENTITY\`, \`APPLE_API_ISSUER\`, \`APPLE_API_KEY\`,"
              echo "\`APPLE_API_PRIVATE_KEY\` and \`TAURI_SIGNING_PRIVATE_KEY\`, then"
              echo "re-run this tag. Signing material that is present but malformed"
              echo "still fails the build."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signing material complete: the Apple certificate set and the updater key are both present"
          fi

          {
            echo "apple=$apple"
            echo "updater=$updater"
            echo "degraded=$degraded"
          } >> "$GITHUB_OUTPUT"

  # The release body, read from the changelog section for this tag. Its own job
  # so it runs once rather than per platform, and so a missing section fails in
  # seconds instead of after every build — `build` needs it, so nothing ships
  # without it. `scripts/release.sh --tag` refuses to create the tag in the
  # first place; this catches a tag made by hand or pushed from elsewhere.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      body: ${{ steps.read.outputs.body }}
    steps:
      - uses: actions/checkout@v7

      # The heading is matched against the tag, not package.json: a tag on a
      # commit whose version was never bumped should fail here rather than
      # publish notes for a version that was not released.
      - name: Read this tag's changelog section
        id: read
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            # A rehearsed tag (see the gates on the mirror and publish jobs)
            # never becomes a release, so requiring release notes for it would
            # be requiring prose nobody reads. Say what it is instead.
            *-*)
              printf 'Rehearsal build tagged `%s`. It signs and notarizes to exercise the release pipeline; it is not a release and is never published.\n' "$GITHUB_REF_NAME" > notes.md
              ;;
            *)
              # From "## [<version>]" up to the next "## [" heading. The heading
              # itself is dropped: the release is already titled "Kiwano v<version>".
              awk -v v="$version" '
                index($0, "## [" v "]") == 1 { found = 1; next }
                found && /^## \[/ { exit }
                found { print }
              ' CHANGELOG.md > notes.md
              # Whitespace-only counts as empty: a heading with nothing under it
              # would otherwise publish a release with no notes at all.
              grep -q '[^[:space:]]' notes.md || {
                echo "::error::CHANGELOG.md has no '$version' section with content — write it, commit it, then re-tag"
                exit 1
              }

              # Translations, when there are any. `docs/release-notes/<version>.<locale>.md`
              # is appended below its own marker, and the app shows a reader the
              # section for their language (app/src/lib/releaseNotes.ts). A
              # release with no such files carries English alone, which is what
              # every release before this one looks like — so a translation that
              # never arrives costs a gap in the prose, not a broken release.
              shopt -s nullglob
              for file in "docs/release-notes/$version".*.md; do
                locale=$(basename "$file" .md)
                locale=${locale#"$version".}
                printf '\n\n<!-- notes:%s -->\n\n' "$locale" >> notes.md
                cat "$file" >> notes.md
                echo "appended release notes for $locale"
              done
              shopt -u nullglob
              ;;
          esac
          {
            echo 'body<<KIWANO_CHANGELOG_EOF'
            cat notes.md
            echo 'KIWANO_CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin # Apple Silicon (M series)
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin # Intel
            rust_targets: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          # A leg with no GUI. The server bundle is plain Rust — no Tauri, no
          # webkit, no desktop session — which is what makes it buildable on a
          # platform the app itself does not support: arm64 Linux is servers,
          # containers on Apple Silicon and Raspberry Pis, and the CLI and
          # gateway are the whole of what belongs there.
          #
          # `server_only: true` is what every GUI step below is gated on. The
          # packaging, the upload and the mirror are not: those produce the
          # same artifact on this leg as on the others. `ubuntu-22.04-arm`
          # is a standard hosted runner, free for public repositories, and it
          # builds natively — the alternatives (cross-compiling SQLite and
          # aws-lc from an x86 runner) are a cross C toolchain for the same
          # bytes, and can only fail in more ways.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            server_only: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # No `version:` here: pnpm/action-setup reads `packageManager` from
      # package.json, and pinning both is an error in v6 — which is how this
      # workflow came to fail every run since the pin landed.
      - if: ${{ !matrix.server_only }}
        uses: pnpm/action-setup@v6

      - if: ${{ !matrix.server_only }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # The lockfile lives with the frontend, not at the repo root.
          cache-dependency-path: app/pnpm-lock.yaml

      - if: ${{ !matrix.server_only }}
        name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Same Tauri v2 system packages as ci.yml (webkit2gtk 4.1 + ayatana appindicator)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.server_only
        run: |
          APT="timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The Linux leg builds on 22.04 on purpose: a GNU binary runs on its
      # build glibc or newer, never older, so the newest-LTS runner was
      # silently shipping binaries that only Ubuntu 24.04 could execute (a
      # 20.04 server installed cleanly and then failed with five bare
      # "GLIBC_2.xx not found" lines). jammy's glibc 2.35 sets the floor the
      # installer enforces; webkit2gtk-4.1 exists on jammy, so the desktop
      # bundles build there too.

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Which identity signs the macOS bundles, in one place, so the degraded
      # path cannot be half-applied: the Developer ID when the certificate set
      # is complete, ad-hoc (`-`) when it is absent.
      #
      # Ad-hoc is the floor rather than a nicety. Tauri signs nothing at all
      # when it has neither a certificate nor an identity, and an arm64 bundle
      # with no signature does not launch — so "unsigned" would mean "does not
      # run", on the machine that just built it. With `-` it runs there and
      # Gatekeeper refuses it anywhere else, which is what the release banner
      # says. Everything downstream reads $APPLE_SIGNING_IDENTITY from here:
      # the artifact verification steps are the ones that would otherwise
      # rubber-stamp an ad-hoc signature as ours.
      - name: Resolve the macOS signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          IDENTITY: ${{ needs.verify.outputs.apple == '1' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -euo pipefail
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "macOS bundles will be signed with: $IDENTITY"

      # Both Apple blobs are decoded verbatim by Tauri, and their exact bytes
      # depend on how they were pasted into the secret — a trailing newline in
      # APPLE_CERTIFICATE surfaces as a base64 error that reads like a wrong
      # password. Normalize once, here, instead of debugging that later.
      - name: Prepare the Apple signing material
        if: runner.os == 'macOS' && needs.verify.outputs.apple == '1'
        shell: bash
        env:
          CERT_RAW: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          # Base64, so whitespace is never meaningful; strip it all.
          cert=$(printf '%s' "$CERT_RAW" | tr -d '[:space:]')
          echo "APPLE_CERTIFICATE=$cert" >> "$GITHUB_ENV"

          # The .p8 has to exist as a file: Tauri takes its *path* in
          # APPLE_API_KEY_PATH, while APPLE_API_KEY is the Key ID, not the key.
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

          # The certificate's Team ID, parsed out of the identity string
          # ("Developer ID Application: Name (TEAMID)") instead of kept as a
          # second secret that could drift from it. The verification steps below
          # pin every signed artifact to this team, and a Team ID that silently
          # disagreed with the signing identity would turn those checks into
          # rubber stamps.
          #
          # A value this step cannot parse fails here rather than degrading: the
          # probe established that a secret is *present*, which makes this a
          # malformed secret, and a malformed secret is a bug in this repository
          # rather than an environment that cannot sign.
          team=$(printf '%s' "$APPLE_SIGNING_IDENTITY" | sed -n 's/.*(\([A-Za-z0-9]*\))$/\1/p')
          [ -n "$team" ] \
            || { echo "::error::APPLE_SIGNING_IDENTITY must look like 'Developer ID Application: Name (TEAMID)', got a value this step cannot parse"; exit 1; }
          echo "APPLE_TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "signing identity resolved for team $team"

      # The updater key gets the same treatment as the Apple blobs above, for
      # the same reason — but the shape here is easy to get wrong, so it is
      # checked rather than just tidied.
      #
      # `tauri build` reads TAURI_SIGNING_PRIVATE_KEY as one environment string
      # and does exactly two things with it: if the value names an existing file
      # it reads that file, and either way it hands the result to a *strict*
      # base64 decoder whose output must be the two-line rsign/minisign
      # secret-key box (`untrusted comment: ...` then the `RW...` key line).
      # `pnpm tauri signer generate -w ~/.tauri/kiwano.key` already writes that
      # base64 into the key file, so the secret is meant to be that file's
      # bytes — and a trailing newline, a CR, or a paste that wraps the line
      # then fails *inside* Tauri as "failed to decode base64 key", which reads
      # like a wrong key rather than one stray byte. Normalize it here, where
      # the diagnostic can say what was actually wrong.
      #
      # Shapes accepted, in the order they are told apart: base64 of the key
      # file (whitespace ignored); the key file's own two lines; and the bare
      # `RW...` key line on its own. Anything else fails instead of being
      # passed through to fail later as a bad key.
      #
      # The key is never echoed, not even a prefix: the secret arrives by env
      # var (never interpolated into this script), and the only things printed
      # below are a shape name and a length.
      # Skipped when the probe found no key at all: there is nothing to
      # normalize, and the build turns updater artifacts off for this run
      # instead (see the `--config` in the tauri-action step). A key that *is*
      # present still has to survive every check below — absence and malformed
      # are different failures, and only the first one degrades.
      - name: Normalize the updater signing key
        if: needs.verify.outputs.updater == '1'
        shell: bash
        env:
          KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          fail() { echo "::error::$*"; exit 1; }

          # Base64 of whole 4-character groups, with any padding only at the
          # end. Worth asserting before a decoder ever sees the value: macOS's
          # base64 silently drops an incomplete trailing group where GNU's
          # errors out, so without this a truncated secret could decode to
          # something plausible on one runner and fail cryptically on another.
          base64_shape() {
            case "$1" in
              ''|*[!A-Za-z0-9+/=]*) return 1 ;;
            esac
            [ $(( ${#1} % 4 )) -eq 0 ] || return 1
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9+/]*={0,2}$'
          }

          [ -n "${KEY_RAW:-}" ] || fail "TAURI_SIGNING_PRIVATE_KEY is empty or unset"

          work="$RUNNER_TEMP/updater-key"
          mkdir -p "$work"
          printf '%s' "$KEY_RAW" > "$work/raw"

          first_line=$(head -n 1 "$work/raw" | tr -d '\r')
          case "$first_line" in
            # The key file's own contents. Nothing to decode; just drop CRs so a
            # Windows checkout of the secret is not a line-length difference. A
            # wrapped key line shows up below as a third line, which the box
            # check rejects rather than silently truncating the key.
            'untrusted comment:'*)
              shape="two-line key file"
              tr -d '\r' < "$work/raw" > "$work/box"
              ;;

            # The bare key line with the comment stripped. Not a box Tauri can
            # parse, but unambiguous, so put the comment line back — minisign
            # ignores its text — and say so, because it means the secret was
            # copied from somewhere that lost the first line.
            RW*)
              compact=$(tr -d '[:space:]' < "$work/raw")
              base64_shape "$compact" \
                || fail "TAURI_SIGNING_PRIVATE_KEY starts with the key material but is not complete base64 — it is probably truncated"
              shape="bare key line (comment line restored)"
              printf 'untrusted comment: rsign encrypted secret key\n%s\n' "$compact" > "$work/box"
              ;;

            # base64 of the key file. Whitespace is never meaningful in base64,
            # but Tauri's decoder rejects it instead of ignoring it — which is
            # the whole bug this step exists for — so strip all of it first.
            *)
              compact=$(tr -d '[:space:]' < "$work/raw")
              [ -n "$compact" ] || fail "TAURI_SIGNING_PRIVATE_KEY is empty or only whitespace"
              base64_shape "$compact" \
                || fail "TAURI_SIGNING_PRIVATE_KEY is neither a two-line key file nor complete base64 — refusing to guess at a truncated or wrong secret"
              shape="base64 of the key file"
              printf '%s' "$compact" > "$work/compact"
              # Decode dialect: GNU spells it --decode, BSD -D, and macOS's
              # base64 takes no file argument, so both read the file on stdin.
              # Each attempt truncates its output, so a failed first try cannot
              # leave half a decode behind for the fallback to append to.
              if ! base64 --decode < "$work/compact" > "$work/box" 2>/dev/null; then
                base64 -D < "$work/compact" > "$work/box" 2>/dev/null \
                  || fail "TAURI_SIGNING_PRIVATE_KEY is base64-shaped but does not decode — it is probably truncated"
              fi
              ;;
          esac

          # Every branch above now holds the two-line box. Prove that before
          # re-encoding, because a box of the wrong shape is what makes Tauri's
          # error read like a wrong key: line count, the comment, and a key line
          # that is base64 starting with the rsign `RW` prefix.
          lines=$(grep -c '[^[:space:]]' "$work/box" || true)
          [ "$lines" -eq 2 ] \
            || fail "the updater signing key is not a two-line key box (found $lines non-blank lines) — the secret should be the base64 of ~/.tauri/kiwano.key"
          box_comment=$(head -n 1 "$work/box" | tr -d '\r')
          box_key=$(sed -n '2p' "$work/box" | tr -d '\r')
          case "$box_comment" in
            'untrusted comment:'*) ;;
            *) fail "the updater signing key's first line is not an 'untrusted comment:' line — refusing to pass it through" ;;
          esac
          case "$box_key" in
            '') fail "the updater signing key has no key line — only the comment line survived" ;;
            RW*) base64_shape "$box_key" \
                   || fail "the updater signing key's key line is not complete base64 — it is probably truncated" ;;
            *) fail "the updater signing key's second line does not start with 'RW' (rsign), so it is not an updater secret key" ;;
          esac

          # Hand Tauri base64 produced by our own encoder, always a single
          # canonically padded line whatever shape the secret arrived in: the
          # encoder wraps at 76 columns, so unfold it. The length check is the
          # self-check on that unfolding.
          normalized=$(base64 < "$work/box" | tr -d '\r\n')
          size=$(wc -c < "$work/box" | tr -d '[:space:]')
          expected=$(( (size + 2) / 3 * 4 ))
          [ "${#normalized}" -eq "$expected" ] \
            || fail "internal error: normalized key is ${#normalized} characters, expected $expected"
          printf 'TAURI_SIGNING_PRIVATE_KEY=%s\n' "$normalized" >> "$GITHUB_ENV"
          echo "updater signing key normalized and checked (source shape: $shape)"

      # The app alone is not a runnable Kiwano: the gateway daemon is an
      # `externalBin`, and Tauri bundles whatever
      # app/src-tauri/binaries/kiwanod-<triple> happens to exist — which,
      # before this step existed, was nothing on every platform, so every
      # shipped build could not start a gateway on a machine that had never
      # compiled one. Build it for the target being bundled, explicitly: the
      # beforeBuildCommand hook cannot see --target.
      - if: ${{ !matrix.server_only }}
        name: Build the gateway sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }} --profile release

      - if: ${{ !matrix.server_only }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action runs the build through the package manager — with
          # `tauriScript` unset it resolves to `pnpm tauri build`, which is this
          # repo's `tauri` script and rebuilds the sidecar. Without this the
          # wrapper would stage the *host* triple, and on the x86_64 leg of an
          # arm64 runner Tauri would then look for a file that does not exist.
          KIWANO_SIDECAR_TARGET: ${{ matrix.target }}
          # Deliberately no TAURI_SIGNING_PRIVATE_KEY here: the normalization
          # step above exports it through $GITHUB_ENV, which is in this step's
          # environment already, and an expression here would only be a second
          # place to get it wrong. See the note on that step for what Tauri
          # accepts and why a stray newline reads like a wrong key.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization. Tauri imports the .p12 into a
          # temporary keychain itself, so there is no security(1) dance here.
          # The identity is a secret rather than a tauri.conf.json value because
          # it carries a personal name, and this is expected to become the LLC's
          # when the membership converts.
          #
          # APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY and APPLE_API_KEY_PATH are
          # deliberately *not* repeated here: the steps above export them
          # through $GITHUB_ENV, which this step inherits. Listing them again
          # would read the secret a second time and, in a degraded run, turn an
          # absent certificate into an empty string — and Tauri's
          # `var_os("APPLE_CERTIFICATE")` seeing Some("") is the difference
          # between signing ad-hoc and trying to import an empty .p12, which
          # fails as base64 (the failure mode the notes above describe).
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          # The frontend and the Tauri shell live under app/. Without this the
          # action looks for src-tauri at the repo root, and — because it also
          # falls back to a globally installed CLI when it cannot find a project
          # — fails in a way that reads like a Tauri bug rather than a path.
          # The Cargo target directory is unaffected: the action walks up from
          # the Tauri directory to the workspace root, which is still the repo
          # root, so `target/` stays where every later step expects it.
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Kiwano ${{ github.ref_name }}"
          # Literal block, not folded: the changelog is Markdown and its line
          # breaks are the formatting.
          #
          # The two lines above the changelog are the degraded-build banner,
          # empty when the signing material was complete. It goes above
          # everything else because it changes whether the rest applies at all,
          # and a reader who stops after a paragraph stops after this one.
          #
          # It says which *kind* of degradation only in general terms: whether
          # it was the Developer ID, the updater key or both is a table in the
          # `verify` job's step summary, and the sentence here would have to be
          # assembled from two flags to be specific. Each expression is a single
          # line because a GitHub expression string cannot carry a newline; the
          # blank lines around it are the block scalar's.
          releaseBody: |
            ${{ needs.verify.outputs.degraded == '1' && '> [!WARNING]' || '' }}
            ${{ needs.verify.outputs.degraded == '1' && '> **This build is degraded.** It was produced in an environment that cannot sign it completely, so at least one of the macOS Developer ID and the updater key is missing — the run summary has the details, including what a degraded macOS bundle means for Gatekeeper. Installed copies are not offered this version. Do not install it over a signed release.' || '' }}

            ${{ needs.changelog.outputs.body }}

            ---

            **macOS builds are signed with a Developer ID and notarized** — open
            the app the usual way. Pick the build for your chip:
            `Kiwano_aarch64.dmg` is Apple Silicon (M series), `Kiwano_x64.dmg` is
            Intel.

            **Windows builds are not code-signed yet.** SmartScreen will warn on
            first launch; choose **More info → Run anyway**.
          # Each platform uploads into a draft; the `publish` job below flips it
          # public once every platform has landed. Publishing from here would
          # expose a half-filled release — and a latest.json missing platforms,
          # which reads as "you are up to date" to whoever checks in that window.
          releaseDraft: true
          # A tag carrying a prerelease suffix (`v0.2.0-rc.1`) is a rehearsal:
          # it builds and verifies, then stops. See the gates below.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The action's own updater manifest is the *merge* point: each leg
          # downloads the draft's latest.json, adds its platform and uploads it
          # again. There is nothing to merge into when no leg produces updater
          # artifacts, and a manifest naming platforms whose downloads are not
          # signed is worse than no manifest — the app would accept the offer
          # and fail the signature check at install time.
          uploadUpdaterJson: ${{ needs.verify.outputs.updater == '1' }}
          # `--config` with inline JSON, because that is what turns updater
          # artifacts off: Tauri fails the whole build when they are on and no
          # key is set ("A public key has been found, but no private key"), so
          # the flag is what lets a keyless environment build at all. The JSON
          # has no spaces in it, which matters because the action splits this
          # string into arguments itself. See the probe step for when this
          # applies.
          args: >-
            --target ${{ matrix.target }}
            ${{ needs.verify.outputs.updater != '1' && '--config {"bundle":{"createUpdaterArtifacts":false}}' || '' }}

      # Tauri notarizes and staples the .app, then builds the .dmg *from* it and
      # never submits the image itself. Gatekeeper assesses a disk image on its
      # own signature, so the download most macOS users actually take came back
      # `rejected — Unnotarized Developer ID` while the app inside was fine.
      # Submit the image too, staple it, and replace the copy tauri-action has
      # already attached to the release, or the two sources would disagree.
      - name: Notarize and staple the DMG
        if: runner.os == 'macOS' && needs.verify.outputs.apple == '1'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          dmg=$(find "$bundle" -maxdepth 3 -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "::error::no .dmg under $bundle"; exit 1; }

          # Apple's notary service has transient bad days: a submit that never
          # reaches it, or a wait that is cut short while the submission itself
          # was fine. One attempt turns a few minutes of their downtime into a
          # failed release, so this retries — but it retries against *one*
          # submission rather than by calling `submit` again.
          #
          # `submit --wait` is not retryable as a unit, because a second call is
          # a second submission on Apple's side. A wait that died for a network
          # reason would then leave two submissions queued behind the same image
          # and the retry would be racing its own predecessor. The submission id
          # is what this loops over: submit once without waiting, record the id,
          # then retry `wait` on that id. Only a submit that yielded no id at all
          # — a transport failure before Apple accepted the upload — is safe to
          # repeat, which is why the two are separated below.
          #
          # `Invalid` is not transient. The submission was received and rejected,
          # and waiting again cannot change the verdict, so it reports the notary
          # log instead — that log is the only place the reason appears.
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")

          max_attempts=3
          submission=""
          notarized=0
          for attempt in $(seq 1 "$max_attempts"); do
            if [ -z "$submission" ]; then
              echo "notarytool submit: attempt $attempt/$max_attempts"
              out=""
              if out=$(xcrun notarytool submit "$dmg" "${auth[@]}" --no-wait --output-format json 2>&1); then
                submission=$(printf '%s' "$out" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null || true)
              else
                printf '%s\n' "$out"
              fi
              if [ -z "$submission" ]; then
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "::error::notarytool submit never returned a submission id after $max_attempts attempts"
                  exit 1
                fi
                backoff=$(( attempt * 60 ))
                echo "submit did not reach the service; retrying in ${backoff}s"
                sleep "$backoff"
                continue
              fi
              echo "submission id: $submission"
            fi

            if out=$(xcrun notarytool wait "$submission" "${auth[@]}" --output-format json 2>&1); then
              notarized=1
              break
            fi

            status=$(printf '%s' "$out" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
            if [ "$status" = "Invalid" ]; then
              echo "::error::notarization rejected the image"
              printf '%s\n' "$out"
              xcrun notarytool log "$submission" "${auth[@]}" || true
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::notarization did not complete after $max_attempts attempts"
              printf '%s\n' "$out"
              exit 1
            fi
            backoff=$(( attempt * 60 ))
            echo "wait failed; retrying submission $submission in ${backoff}s"
            sleep "$backoff"
          done
          # Staple only after a submit actually succeeded — stapling an
          # un-notarized image would just move the failure to the spctl check
          # further down, where it reads as a signing problem.
          [ "$notarized" -eq 1 ] || { echo "::error::notarization did not report success"; exit 1; }

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

          # tauri-action uploaded the pre-staple image; replace it so the GitHub
          # asset and the stapled file the mirror job uploads are the same bytes.
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber

      # Publishing is automatic, so nothing downstream will notice a build that
      # quietly lost its signature — only the user's Gatekeeper dialog would.
      # Prove the signature, the notarization ticket and the staple here, while
      # a failure still costs a release instead of a support thread.
      #
      # Skipped for a build that was never signed: this is the step that reads
      # $APPLE_SIGNING_IDENTITY, and in the degraded path that value is `-`,
      # which would make every check below fail on an artifact that is exactly
      # what it was asked to be. The presence checks that do not care about
      # signing — the sidecar, the version — are unconditional.
      - name: Verify the signed artifacts
        if: runner.os == 'macOS' && needs.verify.outputs.apple == '1'
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          app=$(find "$bundle" -maxdepth 3 -name '*.app' -type d | head -n 1)
          [ -n "$app" ] || { echo "::error::no .app under $bundle"; exit 1; }

          # A requirement, not just "a signature that verifies". `codesign
          # --verify` answers "is this intact and coherently signed", which an
          # app signed by *any* Developer ID certificate satisfies; this pins the
          # leaf certificate to our team, so somebody else's signature fails.
          # APPLE_SIGNING_IDENTITY is resolved in the identity step and
          # APPLE_TEAM_ID in the signing-material step — one writer each, and
          # both of them the value the build itself was handed, so this cannot
          # silently disagree with what actually did the signing.
          requirement="anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""

          # Deliberately *not* `--strict`: that treats a stray FinderInfo xattr
          # as fatal, and a healthy notarized app in /Applications fails it. A
          # gate that cries wolf on a good build gets deleted, not fixed.
          codesign --verify --deep --verbose=2 "$app"
          codesign --verify --verbose=2 -R="$requirement" "$app"

          # The seals prove integrity; the authority line proves it was *us*
          # and not an ad-hoc signature that happens to verify. Matched in full:
          # a prefix match against "Authority=Developer ID Application" accepts
          # every Developer ID certificate in existence, so it can only catch an
          # unsigned artifact, never a wrong signer.
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$info" | grep -Fxq "Authority=$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::$app is not signed by $APPLE_SIGNING_IDENTITY"; printf '%s\n' "$info"; exit 1; }
          printf '%s\n' "$info" | grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" \
            || { echo "::error::$app carries an unexpected TeamIdentifier"; printf '%s\n' "$info"; exit 1; }

          # stapler is the deterministic proof that notarization happened: if
          # the credentials were missing, Tauri signs and skips notarizing, and
          # this is what notices.
          xcrun stapler validate "$app"

          # The end-to-end Gatekeeper verdict — what the user's first launch
          # actually consults.
          spctl --assess --type execute --verbose=2 "$app"

          # The image is assessed on its own signature and notarizing the app
          # inside does not cover it, so this is the check that catches a DMG
          # shipping unnoticed — and it fails an unstabled image on purpose.
          # Required, not optional: the notarization step above already refuses
          # to continue without a DMG, so a missing one here means something is
          # wrong rather than that this platform has no image.
          dmg=$(find "$bundle" -maxdepth 3 -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "::error::no .dmg under $bundle"; exit 1; }
          codesign --verify --verbose=2 "$dmg"
          codesign --verify --verbose=2 -R="$requirement" "$dmg"
          dmg_info=$(codesign -dv --verbose=4 "$dmg" 2>&1)
          printf '%s\n' "$dmg_info" | grep -Fxq "Authority=$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::$dmg is not signed by $APPLE_SIGNING_IDENTITY"; printf '%s\n' "$dmg_info"; exit 1; }
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          echo "signed, notarized and stapled: $app"

      # The gateway daemon is what makes the app work at all, and it lives
      # beside the app binary rather than inside it. Tauri bundles whatever
      # app/src-tauri/binaries/kiwanod-<triple> exists and says nothing when
      # the triple is wrong — the 0.1.7 bundles went out with no gateway on any
      # platform and nothing noticed, because the dev machine always had one
      # running to adopt. Assert it is inside the artifact a user installs.
      - if: ${{ !matrix.server_only }}
        name: Verify the gateway sidecar is in the bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          fail() { echo "::error::$*"; exit 1; }

          case "${{ matrix.target }}" in
            *-apple-darwin)
              app=$(find "$bundle" -maxdepth 3 -name '*.app' -type d | head -n 1)
              [ -n "$app" ] || fail "no .app under $bundle"
              sidecar="$app/Contents/MacOS/kiwanod"
              [ -x "$sidecar" ] || fail "gateway sidecar missing from $app"
              # A nested Mach-O must carry the *same* Developer ID as the app.
              # Notarization would have rejected an unsigned one, so this proves
              # the signature covered the sidecar rather than being drawn around
              # it. Matched in full, because the same certificate has to have
              # signed both — a prefix match would accept any Developer ID, and
              # the sidecar is the binary that actually holds the credentials.
              # The identity variables only exist on macOS, which is why this
              # lives in the macOS arm of the case.
              #
              # `codesign --verify` still runs in a degraded build: an ad-hoc
              # signature is a real signature, and a sidecar that fails this is
              # broken whatever identity is behind it. Only the two comparisons
              # against *our* identity are skipped, because in a degraded build
              # the identity is `-` and there is no team to match.
              codesign --verify --verbose=2 "$sidecar"
              if [ "${{ needs.verify.outputs.apple }}" = "1" ]; then
                sidecar_info=$(codesign -dv --verbose=4 "$sidecar" 2>&1)
                printf '%s\n' "$sidecar_info" | grep -Fxq "Authority=$APPLE_SIGNING_IDENTITY" \
                  || fail "$sidecar is not signed by $APPLE_SIGNING_IDENTITY"
                printf '%s\n' "$sidecar_info" | grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" \
                  || fail "$sidecar carries an unexpected TeamIdentifier"
              fi
              ;;

            *-unknown-linux-gnu)
              # What gets installed, not just what Tauri staged.
              #
              # Not `dpkg-deb -c "$deb" | grep -q …`, which is what this was:
              # under `set -o pipefail`, `grep -q` exits the moment it matches
              # and closes the pipe, `dpkg-deb` dies of SIGPIPE ("tar: stdout:
              # write error", exit 2), and pipefail makes the *pipeline* report
              # that — so a package that plainly contains the file is reported
              # as missing. It failed exactly that way on the first 0.1.9 build.
              # Capturing first and matching without a pipe cannot do this.
              deb=$(find "$bundle/deb" -maxdepth 2 -name '*.deb' | head -n 1)
              [ -n "$deb" ] || fail "no .deb under $bundle/deb"
              deb_contents=$(dpkg-deb -c "$deb") || fail "cannot read $deb"
              case "$deb_contents" in
                *usr/bin/kiwanod*) ;;
                *) fail "gateway sidecar missing from $deb" ;;
              esac
              appimage=$(find "$bundle/appimage" -maxdepth 2 -name '*.AppImage' | head -n 1)
              if [ -n "$appimage" ]; then
                # Resolve before the subshell, not inside it: `find` returns a
                # path relative to the workspace, and the `cd` below would make
                # `realpath` resolve it against the temp directory instead —
                # which is what this step did until the AppImage check ran for
                # the first time and failed on a file that was right there.
                appimage=$(realpath "$appimage")
                chmod +x "$appimage"
                tmp=$(mktemp -d)
                ( cd "$tmp" && "$appimage" --appimage-extract >/dev/null )
                [ -x "$tmp/squashfs-root/usr/bin/kiwanod" ] \
                  || fail "gateway sidecar missing from $appimage"
              fi
              ;;

            *-pc-windows-msvc)
              # Tauri copies externalBin next to the built GUI binary; the
              # installers package from there, so this is the load-bearing
              # check. (Installing silently and looking in %LOCALAPPDATA% would
              # depend on the NSIS installMode default, which nothing here
              # pins.)
              [ -f "target/${{ matrix.target }}/release/kiwanod.exe" ] \
                || fail "Tauri did not stage kiwanod.exe beside the app"
              ;;
          esac
          echo "gateway sidecar present in the ${{ matrix.target }} bundle"

      # What the *installed* app says it is, read out of the artifact a user
      # downloads rather than out of the tree that built it. The CLI gets the
      # same assertion a few steps below, and for the same reason: a version
      # recorded in two places drifts quietly, and nothing else in this pipeline
      # would notice a bundle that reports the wrong one — the release notes,
      # the updater manifest and the .dmg all come from the same tag, so only
      # the binary itself can disagree with them.
      #
      # The version it is compared against is resolved once, in `verify`
      # (`needs.verify.outputs.version`), including how a rehearsal tag's
      # suffix is handled.
      #
      # Windows is not here: its app binary only exists inside the NSIS
      # installer, so it is asserted after a silent install instead — see the
      # smoke job.
      - if: ${{ !matrix.server_only }}
        name: Verify the app reports the version being released
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          fail() { echo "::error::$*"; exit 1; }

          case "${{ matrix.target }}" in
            *-apple-darwin)
              app=$(find "$bundle" -maxdepth 3 -name '*.app' -type d | head -n 1)
              [ -n "$app" ] || fail "no .app under $bundle"
              plist="$app/Contents/Info.plist"
              [ -f "$plist" ] || fail "$app has no Info.plist"
              # Both keys come from the one version in tauri.conf.json:
              # CFBundleShortVersionString is the version macOS shows and the
              # one an update is compared against, CFBundleVersion is the build
              # number. Checking both is what notices a config that sets one and
              # derives the other from somewhere else.
              for key in CFBundleShortVersionString CFBundleVersion; do
                found=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)
                [ "$found" = "$RELEASE_VERSION" ] \
                  || fail "$app: $key says '$found', this tag is version $RELEASE_VERSION"
              done
              echo "the macOS bundle reports $RELEASE_VERSION"
              ;;

            *-unknown-linux-gnu)
              # The package, not the staging directory: this is the file a
              # server installs from, and dpkg's control file is what
              # `apt`/`dpkg -i` would read. The AppImage carries the same
              # binary and no version field of its own, so it is covered by
              # this rather than checked separately.
              deb=$(find "$bundle/deb" -maxdepth 2 -name '*.deb' | head -n 1)
              [ -n "$deb" ] || fail "no .deb under $bundle/deb"
              found=$(dpkg-deb -f "$deb" Version) || fail "cannot read the version out of $deb"
              [ "$found" = "$RELEASE_VERSION" ] \
                || fail "$deb: Version says '$found', this tag is version $RELEASE_VERSION"
              echo "the Linux package reports $RELEASE_VERSION"
              ;;
          esac

      # The server bundle: the CLI and the daemon, plus a unit file and install
      # notes. Packaged here rather than in its own job so it reuses this leg's
      # target directory, and it runs on every leg including the one with no
      # GUI — this is the artifact that leg exists for.
      #
      # Both binaries are named on the cargo line rather than relying on the
      # sidecar step above having built the daemon. That step exists to satisfy
      # Tauri's `externalBin`, so it does not run on a leg with no Tauri build,
      # and a dependency that holds only on the legs that bundle a GUI is the
      # kind that breaks silently. On those legs this is a no-op: same target
      # directory, same profile, already fresh.
      #
      # `cargo build -p kiwano` deliberately does not go through
      # `app/src-tauri/build.rs`, so it cannot fail on a missing sidecar and needs
      # none of the Tauri system libraries the app build requires.
      - name: Package the CLI server bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          triple='${{ matrix.target }}'
          exe=""
          case "$triple" in *windows*) exe=".exe" ;; esac

          cargo build -p kiwano -p kiwanod --release --target "$triple" --locked

          rm -rf dist-cli && mkdir -p dist-cli/pkg
          cp "target/$triple/release/kiwano$exe" dist-cli/pkg/
          cp "target/$triple/release/kiwanod$exe" dist-cli/pkg/
          cp packaging/kiwanod.service dist-cli/pkg/
          cp packaging/INSTALL.md dist-cli/pkg/

          tar czf "dist-cli/kiwano-$triple.tar.gz" -C dist-cli/pkg .

          # A bundle whose client cannot print its own version is not one worth
          # shipping, and a version that disagrees with the tag means something
          # in the version plumbing is wrong.
          #
          # Compared against the tag's *release* version, resolved once in the
          # `verify` job: a rehearsal tag names the release it rehearses and
          # carries a suffix (`v0.1.9-rc.1` against a tree whose version is
          # `0.1.9`), so a comparison against the raw tag would fail every
          # rehearsal. Three other artifacts are asserted against that same
          # value — see `Verify the app reports the version being released`
          # above, and ProductVersion in the smoke job's Windows leg.
          ./dist-cli/pkg/kiwano$exe --version
          built=$(./dist-cli/pkg/kiwano$exe --version | awk '{print $NF}')
          [ "$built" = "$RELEASE_VERSION" ] \
            || { echo "::error::kiwano --version says $built, the tag is $GITHUB_REF_NAME (version $RELEASE_VERSION)"; exit 1; }

          # And the daemon has to be in there: the bundle is useless without it,
          # which is the same failure the sidecar check above exists for.
          #
          # Captured rather than piped into `grep -q` for the reason spelled out
          # at the deb check below — the short-circuit kills the writer and
          # pipefail turns that into a false "missing".
          bundle_contents=$(tar tzf "dist-cli/kiwano-$triple.tar.gz") \
            || { echo "::error::cannot read the server bundle"; exit 1; }
          case "$bundle_contents" in
            *kiwanod*) ;;
            *) echo "::error::the server bundle has no kiwanod"; exit 1 ;;
          esac

          # The digest install.sh checks against when GitHub is unreachable.
          # Per-platform on purpose: every leg writes to the same mirror
          # prefix, and one shared SHA256SUMS would be five uploads racing to
          # overwrite each other with a file describing one platform.
          ( cd dist-cli && sha256sum "kiwano-$triple.tar.gz" > "kiwano-$triple.sha256" )
          cat "dist-cli/kiwano-$triple.sha256"

      - if: ${{ !matrix.server_only }}
        name: Upload the server bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist-cli/kiwano-*.tar.gz --clobber

      # The server-only leg cannot upload to the release itself, and the reason
      # is ordering rather than permission: the draft release is created by
      # tauri-action on the legs that bundle a GUI, and this leg finishes its
      # build in a fraction of the time they take. Uploading here would mean
      # either creating the draft from a step that does not know the release
      # body (the changelog, the install notes, the degraded banner all come
      # from `build`'s tauri-action step) or idling a runner in a wait loop for
      # twenty minutes.
      #
      # So the tarball travels to `release-manifest`, which already runs once
      # after every leg has landed and before the release is published — the
      # same moment the checksums are taken, which is what makes the upload
      # part of that set rather than an addition to a finished release.
      - if: ${{ matrix.server_only }}
        name: Hand the server bundle to the release job
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle-${{ matrix.target }}
          # The tarball only, which is what the other legs put on the release.
          # The per-platform `.sha256` is a mirror file — it exists for
          # `install.sh` on a network that cannot reach GitHub, and the release
          # carries one `SHA256SUMS` over all of its assets instead.
          path: dist-cli/kiwano-*.tar.gz
          # Long enough to outlive the release, short enough not to accumulate:
          # the point of the hop is minutes, not history.
          retention-days: 7
          if-no-files-found: error

      # Mirror the built installers to Cloudflare R2 under releases/ (served at
      # hub.kiwano.cc/releases). Only the newest build lives there: names are
      # version-stripped so every release overwrites the same keys instead of
      # accumulating history. GitHub Releases is where the release is published
      # and where the updater manifest is authored; R2 is the download mirror
      # the updater reads first, so `mirror-manifest` runs after `publish`.
      # shell: bash on every runner (Windows included) so the staging logic is
      # one script rather than a PowerShell rewrite.
      #
      # Not on a rehearsal tag: the mirror's paths carry no version, so a test
      # build would overwrite the download every user is pointed at.
      #
      # Not without an updater key either, for the same reason a rehearsal is
      # excluded: these keys are what `install.sh` and every existing download
      # link resolve to, and a build that cannot sign its own updater artifacts
      # must not become the bytes behind them. The GitHub release still carries
      # everything, banner and all; the mirror keeps serving the last signed
      # release until a signed one replaces it.
      - name: Mirror artifacts to Cloudflare R2
        if: ${{ !contains(github.ref_name, '-') && needs.verify.outputs.updater == '1' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
          # The version the artifact names carry, from the one place that
          # resolves it. This used to read app/package.json, which is the same
          # string — but only because release.sh bumps three files together, and
          # a second reader of it is a second thing to keep in step. It is also
          # why this step no longer needs node: the server-only leg has none.
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The build passes --target, so bundles land under target/<triple>/.
          bundle="target/${{ matrix.target }}/release/bundle"
          version="$RELEASE_VERSION"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)     arch=aarch64 ;;
            x86_64-apple-darwin)      arch=x64 ;;
            x86_64-unknown-linux-gnu) arch=amd64 ;;
            x86_64-pc-windows-msvc)   arch=x64 ;;
          esac

          # Whitelist of real artifacts — create-dmg's support files (share/,
          # *.sh, *.icns, *.xml) never reach the staging dir, so no --exclude
          # patchwork is needed. `dist-cli` is the second root: the server
          # bundle is built outside `bundle/`, and it is the same kind of thing
          # (a download for a user) so it belongs on the mirror too.
          #
          # The roots are collected rather than listed because the server-only
          # leg has no Tauri bundle directory at all — and `find` on a path that
          # is not there exits non-zero, which under `set -e` would fail the leg
          # for producing exactly what it was asked to produce.
          mkdir -p mirror
          roots=(dist-cli)
          [ -d "$bundle" ] && roots=("$bundle" "${roots[@]}")
          find "${roots[@]}" -type f \
            \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.sha256' \) \
            -exec cp {} mirror/ \;

          # Drop the version from every name (Kiwano_0.1.2_x64.dmg →
          # Kiwano_x64.dmg; rpms spell it Kiwano-0.1.2-1.<arch>.rpm), then tag
          # the macOS updater pair with its arch: Tauri names both the Intel
          # and the Apple Silicon build `Kiwano.app.tar.gz`, so without this
          # they would overwrite each other on the mirror.
          #
          # The server bundle (`kiwano-<triple>.tar.gz`) is skipped *before* the
          # rewriting, not matched around afterwards. Its name is already
          # version-free, so the sed is a no-op today — but it is a no-op only
          # because the version does not happen to appear in it, and a name that
          # carries it later would be silently mangled into a different key.
          # Skipping the whole body is the guard; matching one case arm would
          # only skip the second rewrite.
          for f in mirror/*; do
            base=$(basename "$f")
            case "$base" in kiwano-*) continue ;; esac
            name=$(printf '%s' "$base" | sed -e "s/_${version}//" -e "s/-${version}-/-/")
            case "$name" in
              Kiwano.app.tar.gz*) name="Kiwano_${arch}.${name#Kiwano.}" ;;
            esac
            [ "$name" = "$base" ] || mv "$f" "mirror/$name"
          done

          # Version-free names mean the object is *reused* across releases —
          # the same URL serves v0.2.0 today and v0.2.1 tomorrow. That is why
          # the bytes must never be cached longer than one minute: the edge
          # once kept serving a previous version's bytes (an updater said
          # "signature verification failed" because the new manifest's
          # signature met old bytes), so anything longer than a short window
          # re-arms the same failure for the next release's window.
          for f in mirror/*; do
            aws s3 cp "$f" "s3://kiwano-hub/releases/$(basename "$f")" \
              --no-progress \
              --metadata-directive REPLACE \
              --metadata "cache-control=public, max-age=60"
          done

  # Checksums and provenance for the release as a whole, after every platform
  # has landed. Neither belongs to a build leg: the macOS DMG is replaced once
  # it is stapled (see the notarization step above), so a digest or an
  # attestation taken at build time would describe bytes nobody downloads.
  # Taken here, over the assets the release is actually carrying, they mean
  # something.
  #
  # Deliberately not gated on a rehearsal tag. Rehearsals exist to exercise this
  # pipeline end to end, and both outputs land on the draft release only — which
  # a rehearsal never publishes. The artifacts themselves are what a rehearsal
  # must not touch; nothing here does.
  release-manifest:
    name: Checksums and provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `gh release download` and `upload` against the draft release.
      contents: write
      # Fetching the server bundle the server-only leg handed over. Naming any
      # scope in this block sets every scope it does not name to none, so this
      # has to be said out loud rather than left to the default.
      actions: read
      # Keyless: the attestation is signed by this run's GitHub OIDC identity,
      # so there is no key to hold, rotate or leak.
      id-token: write
      attestations: write
    steps:
      # Before anything is read back: the server bundle from the leg that has no
      # GUI is uploaded here rather than by its own leg, because the draft
      # release does not exist until a GUI leg's build finishes (see the
      # hand-off step in `build` for the whole reason). It has to arrive before
      # the checksums are taken, or `SHA256SUMS` and the attestation would
      # describe a release missing one of its downloads.
      #
      # A pattern matching nothing is an error in v4, which is the behaviour
      # wanted here: no artifact means the hand-off broke, not that this release
      # has no such file.
      - name: Collect the server bundle that could not upload itself
        uses: actions/download-artifact@v4
        with:
          pattern: server-bundle-*
          path: server-bundles
          merge-multiple: true

      - name: Upload it to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Matching into an array rather than passing the glob through: with
          # nothing to match, a bare `server-bundles/kiwano-*` reaches `gh` as a
          # literal path and is reported as a missing file, which reads like a
          # lost tarball rather than a missing hand-off.
          shopt -s nullglob
          files=(server-bundles/kiwano-*)
          [ "${#files[@]}" -gt 0 ] \
            || { echo "::error::the server-bundle artifact arrived empty"; exit 1; }
          ls -la "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" \
            --clobber -R "${{ github.repository }}"

      - name: Download the release's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            -R "${{ github.repository }}" \
            --dir release-assets
          ls -la release-assets

      # sha256sum's own format, so `sha256sum -c SHA256SUMS` checks a download
      # with nothing beyond coreutils. Written outside the asset directory so it
      # cannot end up hashing itself. The `--` keeps a file name beginning with a
      # dash from being read as an option, and bare names rather than `./`-prefixed
      # ones are what `sha256sum -c` expects to find beside it.
      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      # Binds every asset to this workflow run and this commit — "built by
      # release.yml from this repository at <commit>" — signed by GitHub and
      # verifiable later against a file the user already has. Note what it does
      # *not* say: nothing about whether the code is any good. Provenance
      # answers "where did this come from", which a checksum file, a mirror and
      # a release page all fail to answer, because all three can be replaced.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" SHA256SUMS \
            -R "${{ github.repository }}" --clobber

  # latest.json is assembled by tauri-action as each platform uploads its entry,
  # so mirroring it from the build jobs would race: whichever finished first
  # would publish a manifest missing the other platforms — that is exactly how
  # darwin-x86_64 went missing from the previous release. Fetch it once, after
  # every platform has landed.
  #
  # `needs:` the published release, not just the build, so R2 can never get
  # ahead of what it describes. R2 is the *first* endpoint in tauri.conf.json's
  # updater list and the updater stops at the first manifest that parses, so the
  # mirror is what most installed copies are handed:
  #   - mirrored before published → the app is offered a version whose release
  #     page still says "draft", with no download page behind it. Nothing
  #     downstream can take that back once the manifest is out.
  #   - published but unmirrored → the R2 key is missing, and the app falls
  #     through to the GitHub endpoint, still second in the list and still
  #     correct. Stale is the worse half of this one — it parses, so nothing
  #     falls through and the update is simply never offered — but it is
  #     recoverable: `mirror-manifest.yml` re-mirrors any published tag on
  #     demand. That repair path is exactly why the mirror must still *run*,
  #     deterministically after publishing, rather than be first past the post.
  # The old ordering put the mirror first so a mirror hiccup could not strand
  # the release as a draft. That is now the wrong trade: an unmirrored release
  # has a repair path, an unreleased mirror does not.
  mirror-manifest:
    needs: [verify, build, publish]
    # Same reason as the artifact mirror: the R2 manifest is what the app's
    # updater reads, so a rehearsal must not repoint it — and neither must a
    # build with no updater key, which has no manifest to point it at. The
    # download it would rewrite does not exist there either (`uploadUpdaterJson`
    # is off in that run), so this job would fail on a missing asset rather than
    # mirror anything.
    if: ${{ !contains(github.ref_name, '-') && needs.verify.outputs.updater == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The rewrite step now verifies every platform's signature against the
      # app's bundled updater key *before* uploading — the gate that stops a
      # bad signature from ever reaching a client. The verifier is minisign
      # itself (the updater's checker), so it has to be present; a mirror job
      # that fails here on a missing tool is exactly as broken as one that
      # fails on a bad signature.
      - name: Install minisign (for manifest signature verification)
        run: |
          APT="timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          $APT update
          $APT install -y minisign

      - name: Download the merged updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "${{ github.ref_name }}"
          -R "${{ github.repository }}"
          --pattern latest.json --dir manifest --clobber

      # tauri-action writes api.github.com asset URLs into the manifest, so
      # mirroring it verbatim would move the manifest and leave every download
      # on GitHub — i.e. mirror the half that already works. Rewrite each
      # platform to its version-free R2 path, then prove every rewritten URL
      # serves before uploading: a manifest pointing at a 404 is worse than no
      # mirror, because it looks like a working update until the download fails.
      # The rewrite + checks live in scripts/mirror_manifest.py so this and
      # the re-mirror workflow (`mirror-manifest.yml`) share one implementation
      # — and so it can be exercised locally, which is how the HEAD/S3 mix-up
      # below got caught.
      - name: Point the mirror's manifest at the mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: >-
          python3 scripts/mirror_manifest.py
          --manifest manifest/latest.json
          --out manifest/latest.r2.json
          --bucket kiwano-hub

      - name: Mirror it to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: >-
          aws s3 cp manifest/latest.r2.json s3://kiwano-hub/releases/latest.json
          --no-progress --metadata-directive REPLACE
          --metadata "cache-control=public, max-age=60"

      # The GitHub endpoint serves tauri-action's own manifest — which has
      # carried the bad generic windows signature since 0.2.0 (the rewrite
      # step above repairs it for R2). Both endpoints now serve the same
      # verified file: content was the thing that forked during the incident,
      # so the two are deliberately made one file. The manifest's urls point
      # at the mirror, so a download the GitHub endpoint exists for — "R2 is
      # down, GitHub is up" — keeps working as long as R2 answers, which is
      # the same condition the old url shape had.
      - name: Reconcile the GitHub endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp manifest/latest.r2.json manifest/latest.json
          gh release upload "${{ github.ref_name }}" manifest/latest.json \
            --clobber -R "${{ github.repository }}"

  # Install the packaged artifact and prove it comes up — on the release this
  # run just published, automatically. Lives inside this workflow rather than
  # as its own `on: release: published` workflow because the publish job uses
  # GITHUB_TOKEN, and GitHub does not deliver events triggered by that token
  # to other workflows (the anti-recursion rule) — which is why v0.2.2's
  # release ran no smoke at all. A job here is not an event, so it runs.
  # Rehearsal tags publish nothing and are skipped like every mirror gate.
  smoke:
    name: Release smoke
    needs: [verify, publish, mirror-manifest]
    # Written out rather than left to the default rule, because `needs` now
    # includes a job that a degraded release skips: without this, a skipped
    # `mirror-manifest` would skip the smoke too, and a degraded build is
    # exactly the one whose artifact nobody has installed yet. The condition is
    # what the default would have been — everything it needs succeeded — with
    # the rehearsal gate kept.
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    permissions:
      # `gh release download` reads; upload-artifact needs actions: write.
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # The leg with no GUI, and therefore no artifact to download: arm64
          # Linux gets the CLI and the gateway, and `install.sh` is how they
          # arrive. It is exercised as published, on the architecture that has
          # no app — see the two steps it adds below.
          - os: ubuntu-22.04-arm
            server_only: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - if: ${{ !matrix.server_only }}
        name: Download the platform artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            pattern='Kiwano_*_x64-setup.exe'
          else
            pattern='Kiwano_*_amd64.AppImage'
          fi
          if ! gh release download "${{ github.ref_name }}" \
              --pattern "$pattern" --dir artifacts --clobber; then
            echo "::error::no artifact matched '$pattern' on ${{ github.ref_name }}"
            gh release view "${{ github.ref_name }}" --json assets \
              -q '.assets[].name' || true
            exit 1
          fi
          echo "downloaded: $(ls artifacts)"

      # ── Windows: silent-install, locate, launch ──────────────────────────
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
          Write-Host "--- artifacts ---"
          Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -ErrorAction Continue | Format-Table -AutoSize | Out-String | Write-Host
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -Filter '*.exe' -ErrorAction Stop |
            Select-Object -First 1 -ExpandProperty FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait -ErrorAction Stop
          $roots = @(Join-Path $env:LOCALAPPDATA 'Kiwano'),
                    (Join-Path $env:LOCALAPPDATA 'Programs\Kiwano'),
                    (Join-Path ${env:PROGRAMFILES} 'Kiwano')
          $exe = $null
          foreach ($root in $roots) {
            $found = Get-ChildItem -Path $root -Recurse -Filter 'kiwano-app.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($found) { $exe = $found; break }
          }
          if (-not $exe) {
            # Name what is actually on disk before giving up: the installer's
            # layout is the thing being tested, and a bare "not found" costs a
            # round trip to learn what it actually wrote.
            foreach ($root in $roots) {
              Write-Host "--- $root ---"
              Get-ChildItem $root -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName | Format-Table -AutoSize | Out-String | Write-Host
            }
            Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Directory -ErrorAction SilentlyContinue |
              Where-Object Name -like '*iwano*' | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "installed kiwano-app.exe not found under: $($roots -join ', ')"
          }
          echo "APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # The Windows half of `Verify the app reports the version being released`,
      # which the build job runs on the other two platforms. It is here rather
      # than there because the Windows app binary only exists inside the
      # installer: Tauri's NSIS bundle has no staged copy to read a version out
      # of, so the assertion waits for something to have installed it.
      #
      # Read from the installed *executable's* own resource — Tauri writes
      # `ProductVersion` from the config version at build time (see
      # `tauri-build`'s windows resource step), so this is the binary answering
      # for itself and not a file name or an installer script doing it.
      - name: Ask the app which version it is (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "${{ needs.verify.outputs.version }}"
          $found = (Get-Item -LiteralPath $env:APP_EXE).VersionInfo.ProductVersion
          Write-Host "the installed app reports $found"
          if ($found -ne $expected) {
            Write-Error "$($env:APP_EXE) reports version '$found', this tag is version $expected"
          }

      - name: Launch the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath $env:APP_EXE

      # ── Linux: AppImage is self-contained (a .deb would drag webkit deps) ─
      - name: Stage the AppImage (Linux)
        if: runner.os == 'Linux' && !matrix.server_only
        run: |
          set -euo pipefail
          img=$(ls artifacts/*.AppImage)
          chmod +x "$img"
          # Runners have no FUSE, so run the extracted payload directly: the
          # runtime's `--appimage-extract` drops `squashfs-root/` without
          # mounting anything, and its `AppRun` then runs the real payload.
          "$img" --appimage-extract
          echo "APP=$(pwd)/squashfs-root/AppRun" >> "$GITHUB_ENV"

      # ── Linux arm64: the server bundle, installed the way a user installs it ─
      #
      # There is no arm64 app to stage, so this leg runs the installer a server
      # user runs — the same command the README gives — and thereby exercises
      # the parts a `gh release download` would stand in for: the published
      # tarball, the checksum checked against GitHub, the archive layout, the
      # glibc floor, and the two binaries that land in the prefix.
      #
      # `--version` pins it to the release being smoked rather than to whatever
      # the mirror's version-free names resolve to by the time this starts.
      - if: ${{ matrix.server_only }}
        name: Install from the published installer (arm64 Linux)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          sh packaging/install.sh --no-service \
            --prefix "$RUNNER_TEMP/prefix" --version "${{ github.ref_name }}"

          # Read out of the binary that was just installed, which is the same
          # assertion the CLI and the desktop app get — on this architecture the
          # server bundle is the only artifact there is to ask.
          #
          # Captured rather than piped into `grep -q`: the short-circuit closes
          # the pipe and `pipefail` reports the writer's SIGPIPE as a failure,
          # which is the false negative spelled out at the deb check in `build`.
          installed=$("$RUNNER_TEMP/prefix/kiwano" --version)
          echo "$installed"
          case "$installed" in
            *"$RELEASE_VERSION"*) ;;
            *) echo "::error::the installed CLI says '$installed', this tag is version $RELEASE_VERSION"; exit 1 ;;
          esac

      - if: ${{ matrix.server_only }}
        name: Start the installed daemon (arm64 Linux)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/prefix/kiwanod" > daemon.log 2>&1 &
          echo $! > daemon.pid
          sleep 3

      # The system GL libraries webkit needs at load time; the AppImage does
      # not bundle them (they are host concern), and the runner has none of
      # them — without these, the app dies before a single log line with
      # `libEGL.so.1: cannot open shared object file`.
      # ── Linux verification target: the daemon itself. A GNU binary's only
      # runtime dependency beyond its own links is the OS, and the daemon is
      # pure Rust — it runs anywhere the release floor allows. The GUI below
      # is best-effort evidence: chasing webkit/GTK/dbus details on a headless
      # runner tests the runner's desktop stack, not this package.
      - name: Run the daemon directly (Linux)
        if: runner.os == 'Linux' && !matrix.server_only
        shell: bash
        run: |
          set -euo pipefail
          daemon_bin=$(find squashfs-root -type f -name 'kiwanod' | head -1)
          echo "daemon: $daemon_bin"
          "$daemon_bin" > daemon.log 2>&1 &
          echo $! > daemon.pid
          sleep 3

      # The GUI is evidence, never the gate. The environment chase — GL, dbus,
      # the x-extensions webkit dlopen's — runs inside a step that is allowed
      # to fail, because a missing picture is not a broken package.
      - name: GUI, best-effort (Linux)
        if: runner.os == 'Linux' && !matrix.server_only
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libegl1 libgl1 libgles2 libglx-mesa0 \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libxkbcommon0 dbus-x11 shared-mime-info imagemagick \
          || sudo apt-get install -y libegl1 libgl1 libgles2 libglx-mesa0 \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libxkbcommon0 libasound2t64 dbus-x11 shared-mime-info imagemagick
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          dbus-run-session -- "$APP" > app.stderr 2>&1 &
          echo $! > app.pid
          sleep 25
          import -display :99 -window root window.png || true
          echo "captured: $(ls -la window.png 2>/dev/null || echo none)"

      # The shared sign of life: the gateway's data plane is listening. A
      # request with no placeholder key is answered 401 (`gateway::router`),
      # and a refused connection would surface as 000 — so anything in
      # {400..499} means the daemon bound :8317 and is reading the DB.
      - name: Prove the gateway is listening
        shell: bash
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -X POST http://127.0.0.1:8317/v1/chat/completions \
              -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 2
          done
          echo "data plane answered $code"
          case "$code" in
            4[0-9][0-9]|2[0-9][0-9]) echo "gateway is up" ;;
            *) echo "::error::data plane never answered; code=$code" ; exit 1 ;;
          esac

      - name: Ask the admin plane for its version (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - "${{ github.ref_name }}" "$HOME" <<'PY'
          import json, os, socket, sqlite3, sys
          tag, home = sys.argv[1], sys.argv[2]
          db = os.path.join(home, ".kiwano", "kiwano.db")
          token = sqlite3.connect(db).execute(
              "SELECT value FROM app_settings WHERE key = 'gateway.admin_token'"
          ).fetchone()[0]
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.connect(os.path.join(home, ".kiwano", "admin.sock"))
          # The admin plane answers with keep-alive headers and never closes
          # the connection, so a bare recv loop waits for an EOF that will not
          # come — on the very success this step is verifying. Bounded reads:
          # stop at the first quiet second and parse what arrived.
          sock.settimeout(10)
          sock.sendall(
              f"GET /status HTTP/1.1\r\nHost: localhost\r\n"
              f"x-kiwano-admin-token: {token}\r\n\r\n".encode()
          )
          data = b""
          while True:
              try:
                  chunk = sock.recv(65536)
              except socket.timeout:
                  break
              if not chunk:
                  break
              data += chunk
          body = json.loads(data.split(b"\r\n\r\n", 1)[1])
          print("admin plane:", {k: body[k] for k in ("name", "version")})
          assert body["name"] == "kiwanod", body
          assert body["version"] == tag.lstrip("v"), (body["version"], tag)
          PY

      # The daemon also writes its own log; a `ready` line is independent
      # evidence (the data-plane probe could in theory hit a stale listener
      # from a previous smoke on a shared runner — it cannot).
      - name: The daemon's log says ready
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          ready=0
          for i in $(seq 1 60); do
            if { grep -rq "kiwanod ready" "$HOME/.kiwano/logs/" 2>/dev/null || grep -q "kiwanod ready" daemon.log 2>/dev/null; }; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::no 'kiwanod ready' in ~/.kiwano/logs"
            ls -la "$HOME/.kiwano/logs/" 2>/dev/null || true
            exit 1
          fi
          echo "daemon log shows ready"

      # Evidence for a human, never a gate: a window that renders is nice to
      # look at, but a headless runner's capture is exactly as reliable as the
      # probes above and less definitive. Failing hard on a screenshot nuance
      # would burn a release.
      - name: Stop the app
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //F //IM kiwano-app.exe 2>/dev/null || true
            taskkill //F //IM kiwanod.exe 2>/dev/null || true
          else
            kill "$(cat daemon.pid 2>/dev/null)" 2>/dev/null || true
            kill "$(cat app.pid 2>/dev/null)" 2>/dev/null || true
            pkill -f 'squashfs-root/AppRun' 2>/dev/null || true
            pkill -f 'kiwanod' 2>/dev/null || true
          fi

      # `https://hub.kiwano.cc/install.sh` — the one-command server install.
      #
      # At the bucket root rather than under releases/, which is where the
      # artifacts live: this is not an artifact, it is the way to get them, and
      # it is the URL people type.
      #
      # Published here, from the job that runs once and only on a real release,
      # for two reasons. Four legs run the artifact mirror in parallel and would
      # each upload this file; and a rehearsal tag must not replace the script
      # every existing user's next install will fetch.
      #
      # Content type is set explicitly: S3 defaults to binary, and a shell
      # script served as application/octet-stream still pipes into `sh` fine but
      # reads as a download in a browser.
      # One line on purpose: this step runs on Linux's bash and Windows's
      # pwsh, and a backslash continuation is a line joiner for the first and
      # a stray argument for the second — two platforms, one syntax that both
      # accept is the single-line form.
      - name: Publish the installer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: aws s3 cp packaging/install.sh s3://kiwano-hub/install.sh --metadata-directive REPLACE --content-type 'text/x-shellscript; charset=utf-8' --cache-control 'public, max-age=300' --no-progress

  # No human in the loop: publishing is a tag push and nothing else.
  #
  # `needs: [build, release-manifest]` — everything that is *part of the release*
  # has to be on it before it goes public, and SHA256SUMS is part of it: a
  # checksum file added to a release that is already live would be a race for
  # whoever downloads in that window, and would name a set of assets that was
  # briefly incomplete.
  #
  # Never the mirror jobs: this job is what the mirror orders itself behind
  # (`mirror-manifest` needs: this one), so waiting on the mirror here would be
  # circular, and a mirror hiccup must not leave the release stranded as a
  # draft. The release is the deliverable; the mirror is downstream of it.
  publish:
    needs: [build, release-manifest]
    # A prerelease suffix makes this a rehearsal: the release stays a draft for
    # the author to inspect and delete, and never becomes what `latest` points
    # at — which would hand every installed copy an RC via the updater.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "${{ github.ref_name }}"
          -R "${{ github.repository }}"
          --draft=false --latest
