[package]
name = "kiwano"
version = "0.1.0"
description = "Kiwano — local-first AI model Provider manager"
authors = ["john2ai <john@lightconsen.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kiwano_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
kiwano-gateway = { path = "../crates/gateway" }
kiwano-adapters = { path = "../crates/adapters" }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"

# Release profile lives at the workspace root (Cargo ignores per-package profiles).
