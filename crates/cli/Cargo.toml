[package]
name = "kiwano-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "kiwano-cli"
path = "src/main.rs"

[dependencies]
kiwano-gateway = { path = "../gateway" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
