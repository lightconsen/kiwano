[package]
name = "kiwano-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The wire types Kiwano's clients and its daemon agree on"

[lib]
# `kiwano-api` / `kiwano_api`: the same split `kiwano-adapters` uses.
name = "kiwano_api"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minting an agent id: the six hex characters that make a repeated label its own
# agent. Here rather than in either caller because both sides mint ids
# (`migrate.local.md` §6.1).
uuid = { version = "1", features = ["v4"] }
