# Tag-triggered release build (docs/upgrade.md phase 3, lightweight variant).
# Pushing a `v*` tag builds all three platforms and opens a DRAFT release;
# inspect and publish it manually. Updater artifacts (latest.json + .sig)
# land here once tauri-plugin-updater is wired up (phase 0+1). Builds are
# unsigned for now: macOS Gatekeeper needs right-click → Open, Windows
# SmartScreen shows a warning.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run from a tag ref, not a branch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin # Apple Silicon (M series)
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin # Intel
            rust_targets: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same Tauri v2 system packages as ci.yml (webkit2gtk 4.1 + ayatana appindicator)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kiwano ${{ github.ref_name }}"
          releaseBody: >-
            安装包未做代码签名：macOS 首次打开需右键 → 打开，
            Windows SmartScreen 出现提示时选择“仍要运行”。

            macOS 请按芯片选择：aarch64 = Apple Silicon（M 系列），
            x86_64 = Intel。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Mirror the built installers to Cloudflare R2 under releases/ (served at
      # hub.kiwano.cc/releases). Only the newest build lives there: names are
      # version-stripped so every release overwrites the same keys instead of
      # accumulating history. GitHub Releases stays the updater's authoritative
      # manifest source; R2 is the download mirror.
      # shell: bash on every runner (Windows included) so the staging logic is
      # one script rather than a PowerShell rewrite.
      - name: Mirror artifacts to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # The build passes --target, so bundles land under target/<triple>/.
          bundle="target/${{ matrix.target }}/release/bundle"
          version=$(node -p "require('./package.json').version")

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)     arch=aarch64 ;;
            x86_64-apple-darwin)      arch=x64 ;;
            x86_64-unknown-linux-gnu) arch=amd64 ;;
            x86_64-pc-windows-msvc)   arch=x64 ;;
          esac

          # Whitelist of real artifacts — create-dmg's support files (share/,
          # *.sh, *.icns, *.xml) never reach the staging dir, so no --exclude
          # patchwork is needed.
          mkdir -p mirror
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.exe' -o -name '*.msi' \) -exec cp {} mirror/ \;

          # Drop the version from every name (Kiwano_0.1.2_x64.dmg →
          # Kiwano_x64.dmg; rpms spell it Kiwano-0.1.2-1.<arch>.rpm), then tag
          # the macOS updater pair with its arch: Tauri names both the Intel
          # and the Apple Silicon build `Kiwano.app.tar.gz`, so without this
          # they would overwrite each other on the mirror.
          for f in mirror/*; do
            name=$(basename "$f" | sed -e "s/_${version}//" -e "s/-${version}-/-/")
            case "$name" in
              Kiwano.app.tar.gz*) name="Kiwano_${arch}.${name#Kiwano.}" ;;
            esac
            [ "$name" = "$(basename "$f")" ] || mv "$f" "mirror/$name"
          done

          aws s3 sync mirror s3://kiwano-hub/releases --no-progress

  # latest.json is assembled by tauri-action as each platform uploads its entry,
  # so mirroring it from the build jobs would race: whichever finished first
  # would publish a manifest missing the other platforms — that is exactly how
  # darwin-x86_64 went missing from the previous release. Fetch it once, after
  # every platform has landed.
  mirror-manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the merged updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "${{ github.ref_name }}"
          -R "${{ github.repository }}"
          --pattern latest.json --dir manifest --clobber

      - name: Mirror it to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: aws s3 cp manifest/latest.json s3://kiwano-hub/releases/latest.json --no-progress
