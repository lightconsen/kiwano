[package]
name = "kiwano"
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Kiwano's command-line client: manage providers and agents without the desktop app"

[[bin]]
name = "kiwano"
path = "src/main.rs"

# A library too, so the integration tests can drive the whole command tree
# in-process — `run_with` takes its writers as arguments and never exits.
[lib]
name = "kiwano_cli"
path = "src/lib.rs"

[dependencies]
kiwano-core = { path = "../core" }
kiwano-gateway = { path = "../gateway" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
