# Tag-triggered release build (docs/upgrade.md phase 3, lightweight variant).
# Pushing a `v*` tag builds all three platforms and opens a DRAFT release;
# inspect and publish it manually. Updater artifacts (latest.json + .sig)
# land here once tauri-plugin-updater is wired up (phase 0+1). Builds are
# unsigned for now: macOS Gatekeeper needs right-click → Open, Windows
# SmartScreen shows a warning.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # re-run from a tag ref, not a branch

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin # one dmg for Apple Silicon + Intel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same Tauri v2 system packages as ci.yml (webkit2gtk 4.1 + ayatana appindicator)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kiwano ${{ github.ref_name }}"
          releaseBody: >-
            安装包未做代码签名：macOS 首次打开需右键 → 打开，
            Windows SmartScreen 出现提示时选择“仍要运行”。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
