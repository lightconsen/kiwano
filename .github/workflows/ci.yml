# PR validation: rustfmt, clippy (-D warnings), tests, frontend typecheck+build.
# Rust runs on both Linux and macOS — macOS-gated code (detect.rs / takeover.rs)
# only compiles on the latter; the repo is public so extra runner minutes are free.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Separate job on purpose: as the first step of `rust` below, a formatting
  # nit aborted the whole job, so clippy and the test suite never ran at all.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 on ubuntu 24.04: webkit2gtk 4.1 + ayatana appindicator (tray-icon)
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Version pinned in rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The gateway daemon is an `externalBin`: without it a packaged app has
      # no way to start one, and that failure is invisible in dev, where a
      # gateway is always already running to adopt. Check the config entry and
      # the staging script agree here, on every PR, rather than at release.
      # Debug profile on purpose — this is about the path and the naming.
      - name: Sidecar staging
        run: |
          set -euo pipefail
          grep -q '"externalBin"' src-tauri/tauri.conf.json \
            || { echo "::error::bundle.externalBin is gone from tauri.conf.json"; exit 1; }
          node scripts/build-sidecar.mjs
          triple=$(rustc -vV | sed -n 's/^host: //p')
          test -x "src-tauri/binaries/kiwano-gateway-$triple" \
            || { echo "::error::build-sidecar.mjs did not stage kiwano-gateway-$triple"; exit 1; }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc && vite build` — typecheck plus a real bundle
      - name: Typecheck and build
        run: pnpm build
