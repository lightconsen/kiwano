# Re-mirror the updater manifest on demand.
#
# The release pipeline mirrors it as part of every release. When that step
# fails — a platform key the script does not know, an upload hiccup — the R2
# copy is left behind: it keeps the previous version's manifest, or one whose
# URLs still point at GitHub. Repairing it does not warrant a release, so this
# does exactly what the release job does, against any published tag.
#
#   gh workflow run mirror-manifest.yml                 # newest published release
#   gh workflow run mirror-manifest.yml -f tag=v0.1.5   # a specific one

name: Mirror manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror; empty means the newest published one"
        required: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mirroring $tag"

      - name: Download its updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download "${{ steps.tag.outputs.tag }}"
          -R "${{ github.repository }}"
          --pattern latest.json --dir manifest --clobber

      # The rewrite below verifies every platform signature against the app's
      # bundled updater key before anything is uploaded; its checker is
      # minisign, so the tool has to be here (a missing tool fails the job —
      # fail-closed is the point of the gate).
      - name: Install minisign (for manifest signature verification)
        run: sudo apt-get update && sudo apt-get install -y minisign

      # Same script the release job runs: rewrite every platform URL to its
      # version-free R2 path, prove the objects are in the bucket, check they
      # are publicly reachable, and verify each signature — this is the step
      # that would have caught v0.2.0/0.2.1's bad windows-x86_64 entry.
      - name: Rewrite it to R2 paths and verify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: >-
          python3 scripts/mirror_manifest.py
          --manifest manifest/latest.json
          --out manifest/latest.r2.json
          --bucket kiwano-hub

      - name: Upload it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_ENDPOINT_URL_S3: https://ff2be2b098633861a9f4b24e7ddfdc9d.r2.cloudflarestorage.com
        run: >-
          aws s3 cp manifest/latest.r2.json s3://kiwano-hub/releases/latest.json
          --no-progress --metadata-directive REPLACE
          --metadata "cache-control=public, max-age=60"

      # Both endpoints serve the same verified file — see release.yml's
      # reconcile step. Needs contents: write, which is why this workflow's
      # permission is not the read it used to be.
      - name: Reconcile the GitHub endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp manifest/latest.r2.json manifest/latest.json
          gh release upload "${{ steps.tag.outputs.tag }}" manifest/latest.json \
            --clobber -R "${{ github.repository }}"
