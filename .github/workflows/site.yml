# Deploy the static marketing site (site/) to GitHub Pages.
# Still no build step for the page itself — one file, served as written. The
# one thing that runs is `scripts/sync-site.mjs`, which copies the version and
# the licence name out of `app/package.json` before the upload so the deployed
# page cannot advertise a release or a licence the project has moved past.
#
# `app/package.json` is in the trigger list for that reason: a release bumps it,
# and without this the site would keep its old version until something else
# under `site/` happened to change. PRs never deploy. Site URL:
# https://lightconsen.github.io/kiwano/
#
# One-time repo setting (required before the first run succeeds):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/sync-site.mjs"
      - "app/package.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy mid-flight; queue instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The page carries the release version and the licence name, both copied
      # from `package.json` — and both had gone stale, the licence by two
      # releases. Stamp them from the source of truth before the upload, so the
      # deployed site is current whatever the committed file happens to say.
      - name: Stamp version and licence from app/package.json
        run: node scripts/sync-site.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
