[package]
name = "kiwano-gateway"
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "kiwano_gateway"
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["stream", "json", "blocking"] }
futures-core = "0.3.34"
futures-util = "0.3.34"
kiwano-adapters = { path = "../adapters" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
thiserror = "2"

# Windows DACL hardening in src/store/mod.rs (`harden_permissions`) and the
# named-pipe admin plane in src/server/admin_ipc.rs. Same crate version as
# kiwano-adapters so the two resolve to one windows-sys.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",             # WIN32_ERROR, HANDLE, LocalFree
    "Win32_Security",               # token SID, DACL/ACE types, security-info flags
    "Win32_Security_Authorization", # SetEntriesInAclW / SetNamedSecurityInfoW
    "Win32_Storage_FileSystem",     # FILE_ALL_ACCESS (the mask the ACE grants)
    "Win32_System_Pipes",           # WaitNamedPipeW (bounding the client connect)
    "Win32_System_Threading",       # OpenProcessToken / GetCurrentProcess
] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
